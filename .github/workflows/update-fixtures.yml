# Oppdater kampdata hver mandag (skeleton)
# Aktiver når API-nøkkel ligger i repo Secrets som API_FOOTBALL_KEY.
#
# Flyt:
# 1. Hent Coventry-fixtures (liga + cup) for sesongen
# 2. For FT-kamper: events (målscorere) + statistics
# 3. Skriv assets/data/fixtures.json
# 4. Commit + push → GitHub Pages rebuildes

name: Update fixtures

on:
  schedule:
    # Mandag 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder — koble på API senere
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "Mandagsjobb er klar som skjelett."
          echo "Når API_FOOTBALL_KEY er satt, erstatt dette steget med et script"
          echo "som skriver assets/data/fixtures.json (se scripts/README.md)."
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "Ingen API-nøkkel ennå — hopper over synk (forventet i pitch-fasen)."
          else
            echo "API-nøkkel finnes. Implementer scripts/update-fixtures.mjs neste."
          fi

