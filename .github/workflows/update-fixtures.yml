# Oppdater kampdata hver mandag
# Bruker secrets.API_FOOTBALL_KEY. Hardcap på API-kall i scriptet (gratisplan 100/dag).

name: Update fixtures

on:
  schedule:
    # Mandag 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch fixtures (API-Football)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SEASON: "2026"
          TEAM_ID: "1346"
          MAX_DETAIL_BATCHES: "2"
        run: node scripts/update-fixtures.mjs

      - name: Commit updated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/fixtures.json
          if git diff --staged --quiet; then
            echo "Ingen endringer i fixtures.json"
          else
            git commit -m "chore: update Coventry fixtures from API-Football"
            git push
          fi
